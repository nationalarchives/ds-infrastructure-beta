# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/

user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
#include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # ----------------------------------------------------------------------
    # ds-dev: 10.128.208.2; ds-staging: 10.128.216.2; ds-live: 10.128.50.4;
    resolver ${resolver} ipv6=off;
    # ----------------------------------------------------------------------

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '-- uri: "$uri" -- request_uri "$request_uri"';

    sendfile             on;
    sendfile_max_chunk   1m;

    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     65;
    types_hash_max_size   4096;

    variables_hash_max_size      2048;
    variables_hash_bucket_size   128;

    include        /etc/nginx/mime.types;
    default_type   application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    # include /etc/nginx/conf.d/*.conf;

    map_hash_bucket_size 256;

    # --------
    limit_req_zone $binary_remote_addr zone=one:10m rate=40r/s;

    # publicly accessible  beta
    server {
        set $base_url        %{ if environment == "live" }beta.nationalarchives.gov.uk%{ else }${environment}-beta.nationalarchives.gov.uk%{ endif };

        set $web_catalogue_uri   web-catalogue.${environment}.local;
        set $ups_web_catalogue   http://$web_catalogue_uri;

        set $web_search_uri      web-search.${environment}.local;
        set $ups_web_search      http://$web_search_uri;

        set $web_forms_uri       web-forms.${environment}.local;
        set $ups_web_forms       http://$web_forms_uri;

        set $web_bulkdownload_uri      web-bulkdownload.${environment}.local;
        set $ups_web_bulkdownload      http://$web_bulkdownload_uri;

        set $web_frontend_uri    web-frontend.${environment}.local;
        set $ups_web_frontend    http://$web_frontend_uri;

        limit_req zone=one burst=60 nodelay;

        listen          80 default_server;
        server_name     %{ if environment == "live" }beta.nationalarchives.gov.uk nationalarchives.gov.uk%{ else }${environment}-beta.nationalarchives.gov.uk%{ endif };
        server_tokens   off;

        access_log   /var/log/nginx/public-access.log main;
        error_log    /var/log/nginx/public-error.log;

        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        include cloudfront_ips.conf;

        gzip           on;
        gzip_proxied   expired no-cache no-store private auth;
        gzip_types     *;

        add_header Referrer-Policy          "no-referrer-when-downgrade" always;
        add_header X-Content-Type-Options   "nosniff";
        add_header X-Robots-Tag             "noindex, nofollow, nosnippet, noarchive";

        proxy_intercept_errors           off;
        proxy_buffering                  off;
        proxy_buffer_size                4k;
        proxy_http_version               1.1;
        proxy_headers_hash_max_size      2048;
        proxy_headers_hash_bucket_size   256;

        proxy_set_header Host                $host;
        proxy_set_header X-Forwarded-For     $remote_addr;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Proto   $scheme;

        root /var/nationalarchives.gov.uk;
        
        error_page 400 /error/400/;
        error_page 401 /error/401/;
        error_page 403 /error/403/;
        error_page 404 /error/404/;
        error_page 405 /error/405/;
        error_page 406 /error/406/;
        error_page 407 /error/407/;
        error_page 410 /error/410/;
        error_page 414 /error/414/;
        error_page 429 /error/429/;
        error_page 451 /error/451/;
        error_page 500 /error/500/;
        error_page 502 /error/502/;
        error_page 503 /error/503/;
        error_page 504 /error/504/;

        location ~* ^/error/([4-5][0-9][0-9])/$ {
            internal;
            # Capture the original response's Vary before proxying to the shared error page.
            set $original_upstream_vary $upstream_http_vary;
            add_header Vary $original_upstream_vary always;
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_intercept_errors off;
            recursive_error_pages off;
            proxy_pass $ups_web_frontend/error/$1/;
        }

        location /static {
            expires 1y;
            access_log off;
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_pass $ups_web_frontend;
        }

        location ^~ /media/documents/ {
            deny all;
        }

        location ^~ /media/original_images/ {
            deny all;
        }

        location ~* ^/media/(.*)$ {
            expires 1y;
            access_log off;
            try_files $uri $uri/;
        }
        
        location /catalogue/static {
            expires 1y;
            access_log off;
            proxy_set_header Host $host;
            proxy_set_header x-target "web-catalogue";
            proxy_pass $ups_web_catalogue;
        }
        location /catalogue {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-catalogue";
            proxy_pass $ups_web_catalogue;
        }

        location /og {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_pass $ups_web_frontend;
            proxy_hide_header "Cross-Origin-Resource-Policy";
            add_header "Cross-Origin-Resource-Policy" "cross-origin";
        }

        location /preview {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_pass $ups_web_frontend;
            subs_filter (https?:)(\/\/|\\\/\\\/)(((${environment}-)?www\.)?nationalarchives\.gov\.uk\/preview\/) https://$base_url/preview/ gir;
        }

        location /image {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_pass $ups_web_frontend;
            subs_filter (https?:)(\/\/|\\\/\\\/)(((${environment}-)?www\.)?nationalarchives\.gov\.uk\/image\/) https://$base_url/image/ gir;
        }
        location /audio {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_pass $ups_web_frontend;
            subs_filter (https?:)(\/\/|\\\/\\\/)(((${environment}-)?www\.)?nationalarchives\.gov\.uk\/audio\/) https://$base_url/audio/ gir;
        }
        location /video {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-frontend";
            proxy_pass $ups_web_frontend;
            subs_filter (https?:)(\/\/|\\\/\\\/)(((${environment}-)?www\.)?nationalarchives\.gov\.uk\/video\/) https://$base_url/video/ gir;
        }

        location /forms/static {
            expires 1y;
            access_log off;
            proxy_set_header x-target "web-forms";
            proxy_pass $ups_web_forms;
        }
        location /forms {
            proxy_intercept_errors off;
            proxy_set_header Host $host;
            proxy_set_header x-target "web-forms";
            proxy_pass $ups_web_forms;
        }
        location /apply-for-a-discovery-api-key {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-forms";
            proxy_pass $ups_web_forms;
        }
        location /contact-us/make-a-records-and-research-enquiry {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-forms";
            proxy_pass $ups_web_forms;
        }
        location /catalogue/report-an-issue {
            proxy_set_header Host $host;
            proxy_set_header x-target "web-forms";
            proxy_pass $ups_web_forms;
        }

        location / {
            return 404;
        }

    }

}
